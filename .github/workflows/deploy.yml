name: Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash -n ops/coolify-deploy.sh
      - run: npm run verify:associations
      - run: npm run build
      - name: Verify production container
        run: |
          docker build --tag hemu-site:check .
          docker run --detach --rm --name hemu-site-check --publish 127.0.0.1:18080:8080 hemu-site:check
          trap 'docker stop hemu-site-check' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/ >/dev/null
          npm run verify:associations -- http://127.0.0.1:18080
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-coolify:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: hemu-web-staging-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Coolify and verify app-link metadata
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_SMOKE_URL: ${{ vars.COOLIFY_SMOKE_URL }}
        run: |
          ops/coolify-deploy.sh
          node scripts/verify-associations.mjs "$COOLIFY_SMOKE_URL"
