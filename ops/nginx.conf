server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  # The legal pages are directories, so requesting one without its trailing slash
  # redirects. By default nginx builds that Location from its own listen port,
  # which is not the port anything reaches it on once it is behind a proxy, and
  # sends the visitor somewhere unroutable. Keep those redirects relative.
  absolute_redirect off;

  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Android App Links use the signer-verified fingerprint committed with the
  # corresponding release APK.
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Public share URLs open the native app when App/Universal Links are
  # available. Without the app installed, keep the same URLs useful by
  # serving the landing page instead of the generic 404 page.
  location ^~ /listing/ {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /u/ {
    try_files $uri $uri/ /index.html;
  }

  location = /signup {
    try_files $uri /index.html;
  }

  location ^~ /signup/ {
    try_files $uri $uri/ /index.html;
  }

  # hemu.krd/<username>. A username cannot be told apart from any other single
  # segment, so an unknown one serves the shell exactly as /listing/ and /u/
  # already do, and the app resolves who it means. `try_files` still prefers a
  # real file or directory, so the site's own assets and legal pages answer for
  # themselves — which is why the backend refuses those names as usernames.
  #
  # One segment only: a deeper unknown path is a genuine 404, and this regex
  # ranks below the `=` and `^~` locations above it, so the routes they own are
  # unaffected.
  location ~ "^/[^/]+$" {
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
  }
}
