server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Android App Links use the signer-verified fingerprint committed with the
  # corresponding release APK.
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Public share URLs open the native app when App/Universal Links are
  # available. Without the app installed, keep the same URLs useful by
  # serving the landing page instead of the generic 404 page.
  location ^~ /listing/ {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /u/ {
    try_files $uri $uri/ /index.html;
  }

  location = /signup {
    try_files $uri /index.html;
  }

  location ^~ /signup/ {
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
  }
}
